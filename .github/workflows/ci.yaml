name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27'

jobs:
  ci:
    permissions:
      contents: read
    uses: datum-cloud/actions/.github/workflows/ci-basic.yaml@v1.26.0
    with:
      skip: test,docker
      run: |
        go vet ./...
        go test $(go list ./... | grep -v /e2e)

  lint:
    name: Lint
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MILO_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: task lint

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [ci, lint]
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@latest
          kind version

      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      - name: Install task
        uses: arduino/setup-task@v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install chainsaw
        run: |
          curl -sSfL "https://github.com/kyverno/chainsaw/releases/download/v0.2.12/chainsaw_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin chainsaw
          chainsaw version

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Run E2E suite
        run: task test:e2e
